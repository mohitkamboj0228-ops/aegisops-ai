# Replace the image with your built registry image. Access only with port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aegisops
  template:
    metadata:
      labels:
        app: aegisops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: YOUR_REGISTRY/aegisops:YOUR_IMMUTABLE_TAG
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aegisops-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegisops-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
