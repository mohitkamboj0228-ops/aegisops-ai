name: Deploy AWS workspace
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: aegisops-aws-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m unittest discover -s backend/tests -v
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m pip install -r backend/requirements-ai.txt
      - name: Deploy and verify application
        env:
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
          DEPLOY_VPC: ${{ vars.AWS_VPC_ID }}
          DEPLOY_SUBNET: ${{ vars.AWS_SUBNET_ID }}
          DEPLOY_PROFILE: ${{ vars.AWS_INSTANCE_PROFILE }}
          DEPLOY_MODEL: ${{ vars.BEDROCK_MODEL_ARN }}
        run: >-
          python deploy/aws_deploy.py
          --region "$DEPLOY_REGION" --bucket "$DEPLOY_BUCKET"
          --vpc "$DEPLOY_VPC" --subnet "$DEPLOY_SUBNET"
          --profile "$DEPLOY_PROFILE" --model "$DEPLOY_MODEL"
